<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify-Your Favourite Music is here!</title>
    <link rel="stylesheet"href="style.css">
</head>
<script src="script.js"></script>
<body>
    <nav>
        <ul>
            <li class="brand"><img src="logo.webp"height="70px"weidth="100px" alt="Spotify">Spotifyyy!</li>
            <li>Home</li>
            <li>About</li>
        </ul>
    </nav>

    <div class="container">
      
      <div class="songlist"><h1>Best of NCS-No Copyright Sounds</h1></div>
      <div class="songitem">
        <img src="cover.avif" alt="1"><span>Let Me Love You</span>
        <span class="songlistplay"><span>05:34</span></span><i class="fa-solid fa-play-circle"></i>
      </div>
      <div class="songbanner"></div>
    </div>


    <div class="bottom">
        <input type="range" name="range"id="myprogressbar"min="0"max="100">
        <div class="icons">
        <i class="fa-solid fa-step-backward"></i>
        <i class="fa-solid fa-play-circle"></i>
        <i class="fa-solid fa-step-forward"></i>
        </div>
    </div>
<script src="https://kit.fontawesome.com/c817061840.js" crossorigin="anonymous"></script>
</body>
</html>
