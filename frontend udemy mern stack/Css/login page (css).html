<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginPage</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding:0;
            height:100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card
        {
            background-color: rebeccapurple;
            border-radius: 10px;
            padding: 30px;
            width:300px;
            color: chocolate;
        }
        h1{
            color: greenyellow;
            text-align: center;
            margin-bottom: 3px;
        }
        form{
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input
        {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            background-color:lightcoral;
            border: none;
        }
        button
        {
            background-color: darkgray;
            color: black;
            padding: 10px;
            border-radius: 3px;

        }
button:hover{
    background-color:darkblue;
}

    </style>
</head>
<body style="background-color: black;">
    <div class="card">
        <h1>LoginPage</h1>
        <form>
            <input type="email"placeholder="email">
            <input type="password"placeholder="password">
            <button type="submit">LoginPage</button>
        </form>
    </div>
    
</body>
</html>
