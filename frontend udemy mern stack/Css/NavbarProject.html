<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavBarProject</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color:black;

        }
        .nav-container
        {
            margin-bottom: 30px;
            background-color:brown;

        }
        h1
        {
            margin-bottom: 30px;
        }
        .nav1
        {
            border: 3px ;
            padding: 10px;

        }
        .nav1 ul{
            list-style-type: none;
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin:0px;
        }
        .nav1 li
        {
            display: inline;
        }
        .nav1 a
        {
            text-decoration: none;
            color:rgb(10, 234, 10);
            padding:5px 10px;
            position:relative;
        }
        .nav1 .login-btn
        {
            background-color:grey;
            color: white;
            border: none;
            padding:5px 10px;
            border-radius: 5px;
            cursor:pointer;
        }
        .nav1 a::after
        {
            content:"";
            position:absolute;
            bottom: 0px;
            left: 0;
            width:100%;
            height: 2px;
            background-color: forestgreen;
            transition: transform 0.3;
            transform: scaleX(0);

        }
        .nav1 a:hover::after
        {
            transform: scale(1);
        }
        .nav2
        {
            border: 2px solid blue;
            background-color:#343A40;
            width: 200px;
            padding:10px;


        }
        .nav2 ul{
            list-style-type: none;
            margin: 0;
            padding:0;
            

        }
        .nav2 li
        {
            margin bottom: 10px;

        }
        .nav2 a
        {
            text-decoration: none;
            color:whitesmoke;
            display: block;
            padding:10px;
            width: 100%;

        }
        .nav2 a:hover
        {
            background-color: chocolate;
        }
        .nav2.login-btn2
        {
            color:rgb(173, 255, 182);
            background-color: rgb(10, 235, 96);
            width:100%;
            padding:10px;
            border:none;
            cursor: pointer;
        }
        .nav2.login-btn2:hover
        {
            background-color: lime;
        }





    </style>
</head>
<body>
    <div class="nav-container">
        <h1>Variation1:Horrizontal with underline effect</h1>
        <nav class="nav1">
            <ul>
                <li><a href="#">home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <button class="login-btn">LoginPage</button>
            </ul>
        </nav>
    </div>

    <div class="nav-container">
        <h1>Variation2:Horrizontal with underline effect</h1>
        <nav class="nav2">
            <ul>
                <li><a href="#">home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <button class="login-btn2">LoginPage</button>
            </ul>
        </nav>
    </div>

    <div class="nav-container">
        <h1>Variation3:Horrizontal with underline effect</h1>
        <nav class="nav3">
            <ul>
                <li><a href="#">home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <button class="login-btn">LoginPage</button>
            </ul>
        </nav>
    </div>
</body>
</html>
