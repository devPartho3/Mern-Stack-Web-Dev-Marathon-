<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multiplayer Quiz Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🧠 Multiplayer Quiz Game</h1>

  <div id="setup-container">
    <h2>Enter Player Names</h2>
    <div id="player-inputs">
      <input type="text" placeholder="Player 1 Name" class="player-name">
      <input type="text" placeholder="Player 2 Name" class="player-name">
    </div>
    <button id="add-player">➕ Add Player</button>
    <button id="start-btn">Start Game</button>
  </div>

  <div id="question-container" class="hidden">
    <div id="turn-indicator"></div>
    <div id="timer">⏳ 15s</div>
    <p id="question-text"></p>
    <ul id="choices-list"></ul>
    <button id="next-btn" class="hidden">Next</button>
  </div>

  <div id="result-container" class="hidden">
    <h2>Game Over</h2>
    <div id="leaderboard"></div>
    <button id="restart-btn">Play Again</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
