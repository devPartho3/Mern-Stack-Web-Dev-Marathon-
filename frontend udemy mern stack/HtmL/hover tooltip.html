<!DOCTYPE html>
<html lang="en">
<head>
    <style type="text/css">
        *{
            margin: 3;
            padding: 3;
            box-sizing: border-box;
        }
        body{
            background-color: brown;
            width: 100%;
            height: 100vh;
            display:flex;
            align-items: center;
            justify-content: center;
        }
        #tooltip
        {
            position: relative;
            cursor: pointer;
            border-radius: 10%;
            padding:10px;
            font-size: 20px;

        }
        #tooltiptext
        {
          position:absolute;
          left: 50%;
          top: 0;
          transform: matrix();
          background-color: blue;
          color:brown;
          padding: auto;
          visibility: visible;
          opacity: 1;
          transition: 3s;
        }

        #tooltiptext::before{
            content: "";
            position: absolute;
            left: 50%;
            top:100%;
            transform: matrix();
            border: 10px;

        }
        #tooltip:hover#tooltiptext
        {
            top: 100%;
            visibility: visible;
            opacity: 0;
        }
    </style>
    <title>Hover Tooltip</title>
</head>
<body>
    <div id="tooltip"width="30px"font="300px">
        <span id="tooltiptext" tooltiptext</span>
            <span>hover over me</span>
    </div>
</body>
</html>
